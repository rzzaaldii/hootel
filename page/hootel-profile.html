<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HooTEL – Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../style/hootel.css" rel="stylesheet">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="hootel-dashboard.html"><img src="../img/logo.png" alt="HooTEL"></a>
    <nav class="menu">
      <a href="hootel-dashboard.html"><i class="bi bi-grid-fill"></i><span>Dashboard</span></a>
      <a href="hootel-booking-history.html"><i class="bi bi-journal-bookmark-fill"></i><span>My Booking</span></a>
      <a href="hootel-profile.html" class="active"><i class="bi bi-person-fill"></i><span>Profile</span></a>
    </nav>
    <a href="hootel-signin.html" class="btn-logout"><i class="bi bi-box-arrow-left"></i><span>Log Out</span></a>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="title">
        <h1>Profile</h1>
        <p>Personalize your information account.</p>
      </div>
      <div class="right">
        <i class="bi bi-bell-fill bell"></i>
        <div class="user">
          <img src="../img/cust2.jpg" alt="Briliant Ghithraf">
          <div><strong>Briliant Ghithraf</strong><span>bili123@gmail.com</span></div>
        </div>
      </div>
    </header>

    <main class="content">
      <form class="profile-card">
        <h2>Informasi pribadi</h2>

        <div class="photo-row">
          <img src="../img/cust2.jpg" alt="Foto profil">
          <div>
            <strong>Foto profil</strong>
            <button type="button" class="btn-outline btn-sm">Ubah foto</button>
            <small>JPG atau PNG. Maksimal 2 MB.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="nama">Nama lengkap</label>
          <input type="text" id="nama" value="Briliant Ghithraf">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" value="bili123@gmail.com">
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <button type="button" class="btn-outline btn-xs">Ubah password</button>
          </div>
          <input type="password" id="password" value="............">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-teal btn-save">Simpan perubahan</button>
        </div>
      </form>
    </main>
  </div>

</div>
</body>
</html>
