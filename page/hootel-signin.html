<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HooTEL – Sign In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../style/hootel.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg hootel-nav py-3">
  <div class="container-fluid container-h">
    <a class="navbar-brand" href="hootel-home.html"><img src="../img/logo.png" alt="HooTEL" class="brand-logo"></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="hootel-home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Facilities</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Gallery</a></li>
      </ul>
      <a href="hootel-signin.html" class="btn btn-teal btn-pill">Sign In</a>
    </div>
  </div>
</nav>

<main class="auth auth-signin bg-room">
  <div class="auth-card">
    <div class="brand"><img src="../img/logo.png" alt="HooTEL" class="brand-logo"></div>
    <p class="lead-text">Sign in your account to explore a thousand stay and book now.</p>
    <form action="hootel-dashboard.html">
      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Your Email" required>
      </div>
      <div class="pw-wrap">
        <label for="pw">Password</label>
        <div class="position-relative">
          <input type="password" id="pw" class="form-control" placeholder="Your Password" required>
          <button type="button" class="pw-toggle" data-target="pw" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <a href="#" class="forgot">Forgot password?</a>
      <button type="submit" class="btn btn-teal w-100">Sign In</button>
      <p class="signup-link">Don't have account? <a href="hootel-signup.html">Sign Up</a></p>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/hootel.js"></script>
</body>
</html>
